<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira Vitis - Painel de Gestão</title>
    
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden">
    <div id="root"></div>

    <!-- Script para carregar o Firebase dinamicamente se configurado -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.initFirebaseWithConfig = (configObj) => {
            try {
                const app = initializeApp(configObj);
                const db = getFirestore(app);
                window.firebaseDB = { db, collection, getDocs, setDoc, doc, deleteDoc };
                window.dispatchEvent(new Event('firebase-ready'));
                return true;
            } catch (err) {
                console.error("Erro ao inicializar Firebase:", err);
                return false;
            }
        };

        // Verifica se já existe config salva no navegador
        const savedCfg = localStorage.getItem('ov_firebase_cfg');
        if (savedCfg) {
            try {
                window.initFirebaseWithConfig(JSON.parse(savedCfg));
            } catch (e) {}
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({
                        targets: [iconRef.current]
                    });
                }
            });
            return <i ref={iconRef} data-lucide={name} className={className} {...props}></i>;
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('ov_auth') === 'true');
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('ov_dark') === 'true');
            const [clients, setClients] = useState([]);
            const [projects, setProjects] = useState([]);
            const [timelineItems, setTimelineItems] = useState([]);
            const [kanbanLists, setKanbanLists] = useState([
                { id: 'todo', title: 'A Fazer' },
                { id: 'in-progress', title: 'Em Andamento' },
                { id: 'done', title: 'Concluído' }
            ]);
            const [tasks, setTasks] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);

            const [activeTab, setActiveTab] = useState('clientes');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const [timelineModalProject, setTimelineModalProject] = useState(null);
            const [taskDetailsModal, setTaskDetailsModal] = useState(null);

            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // Estado para configurar o Firebase de forma segura
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [firebaseJsonInput, setFirebaseJsonInput] = useState('');

            useEffect(() => {
                const loadCloudData = async () => {
                    if (!window.firebaseDB) return;
                    setIsSyncing(true);
                    try {
                        const { db, collection, getDocs } = window.firebaseDB;
                        
                        const clientsSnap = await getDocs(collection(db, "clients"));
                        if (!clientsSnap.empty) {
                            setClients(clientsSnap.docs.map(d => d.data()));
                        }
                        const projSnap = await getDocs(collection(db, "projects"));
                        if (!projSnap.empty) {
                            setProjects(projSnap.docs.map(d => d.data()));
                        }
                        const timeSnap = await getDocs(collection(db, "timeline"));
                        if (!timeSnap.empty) {
                            setTimelineItems(timeSnap.docs.map(d => d.data()));
                        }
                        const listsSnap = await getDocs(collection(db, "kanbanLists"));
                        if (!listsSnap.empty) {
                            setKanbanLists(listsSnap.docs.map(d => d.data()));
                        }
                        const tasksSnap = await getDocs(collection(db, "tasks"));
                        if (!tasksSnap.empty) {
                            setTasks(tasksSnap.docs.map(d => d.data()));
                        }
                    } catch (e) {
                        console.error("Erro ao sincronizar com nuvem:", e);
                    } finally {
                        setIsSyncing(false);
                    }
                };

                window.addEventListener('firebase-ready', loadCloudData);
                if (window.firebaseDB) loadCloudData();
                return () => window.removeEventListener('firebase-ready', loadCloudData);
            }, []);

            const saveToCloud = async (collectionName, id, data) => {
                if (!window.firebaseDB) return;
                try {
                    const { db, doc, setDoc } = window.firebaseDB;
                    await setDoc(doc(db, collectionName, id), data);
                } catch (e) {
                    console.error("Erro ao gravar na nuvem:", e);
                }
            };

            const removeFromCloud = async (collectionName, id) => {
                if (!window.firebaseDB) return;
                try {
                    const { db, doc, deleteDoc } = window.firebaseDB;
                    await deleteDoc(doc(db, collectionName, id));
                } catch (e) {
                    console.error("Erro ao remover da nuvem:", e);
                }
            };

            const toggleDarkMode = () => {
                const newMode = !isDarkMode;
                setIsDarkMode(newMode);
                localStorage.setItem('ov_dark', newMode ? 'true' : 'false');
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (
                    loginEmail.trim().toLowerCase() === 'cristhiandeoliveirasantos@gmail.com' && 
                    loginPassword === 'Cristhian20053192@'
                ) {
                    setIsAuthenticated(true);
                    localStorage.setItem('ov_auth', 'true');
                    setLoginError('');
                } else {
                    setLoginError('Acesso negado. Credenciais inválidas.');
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                localStorage.removeItem('ov_auth');
                setLoginEmail('');
                setLoginPassword('');
            };

            const handleSaveFirebaseConfig = (e) => {
                e.preventDefault();
                try {
                    // Tenta extrair ou converter o JSON inserido
                    let cfg = JSON.parse(firebaseJsonInput);
                    localStorage.setItem('ov_firebase_cfg', JSON.stringify(cfg));
                    if (window.initFirebaseWithConfig(cfg)) {
                        alert('Firebase configurado e conectado com sucesso!');
                        setShowConfigModal(false);
                        window.location.reload();
                    } else {
                        alert('Erro ao inicializar Firebase com este objeto.');
                    }
                } catch (err) {
                    alert('JSON inválido. Certifique-se de colar o objeto firebaseConfig corretamente.');
                }
            };

            const generateId = (prefix) => `${prefix}${Math.random().toString(36).substr(2, 9)}`;
            const getClientName = (clientId) => clients.find(c => c.id === clientId)?.company || 'Desconhecido';
            const getProjectName = (projectId) => projects.find(p => p.id === projectId)?.title || 'Desconhecido';
            const formatWhatsApp = (contact) => {
                const digits = contact.replace(/\D/g, '');
                return digits.length >= 10 ? `https://wa.me/55${digits}` : null;
            };

            // --- COMPONENTE: SIDEBAR ---
            const Sidebar = () => (
                <div className={`fixed inset-y-0 left-0 z-40 w-64 ${isDarkMode ? 'bg-[#050e29] border-r border-blue-950' : 'bg-[#08194c]'} text-white transform transition-transform duration-300 ease-in-out ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 flex flex-col shadow-xl flex-shrink-0`}>
                    <div className="flex items-center justify-between p-6 border-b border-blue-950/50">
                        <div className="flex items-center space-x-3">
                            <Icon name="layout-dashboard" className="w-8 h-8 text-blue-300" />
                            <span className="text-xl font-bold tracking-wider">Oliveira Vitis</span>
                        </div>
                        <button className="md:hidden text-white" onClick={() => setIsMobileMenuOpen(false)}>
                            <Icon name="x" className="w-6 h-6" />
                        </button>
                    </div>
                    <nav className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                        {[
                            { id: 'clientes', label: 'Clientes', icon: 'users' },
                            { id: 'projetos', label: 'Projetos', icon: 'briefcase' },
                            { id: 'kanban', label: 'Quadro Kanban', icon: 'kanban' }
                        ].map((item) => (
                            <button
                                key={item.id}
                                onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }}
                                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 ${activeTab === item.id ? (isDarkMode ? 'bg-blue-600 text-white shadow-md font-semibold' : 'bg-white text-[#08194c] shadow-md font-semibold') : 'text-blue-100 hover:bg-white/10 hover:text-white'}`}
                            >
                                <Icon name={item.icon} className={`w-5 h-5 ${activeTab === item.id ? (isDarkMode ? 'text-white' : 'text-[#08194c]') : 'text-blue-300'}`} />
                                <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    <div className="p-4 border-t border-blue-950/50 space-y-3">
                        <button onClick={toggleDarkMode} className="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-blue-100 transition-colors text-sm font-medium">
                            <span className="flex items-center space-x-2">
                                <Icon name={isDarkMode ? "sun" : "moon"} className="w-4 h-4 text-yellow-300" />
                                <span>{isDarkMode ? 'Modo Claro' : 'Modo Escuro'}</span>
                            </span>
                        </button>

                        <button onClick={() => setShowConfigModal(true)} className="w-full flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 text-blue-200 transition-colors text-sm font-medium">
                            <Icon name="database" className="w-4 h-4" />
                            <span>Configurar Nuvem</span>
                        </button>

                        <div className="flex items-center space-x-2 text-xs text-blue-300 px-2">
                            <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-yellow-400 animate-ping' : (window.firebaseDB ? 'bg-emerald-400' : 'bg-gray-400')}`}></span>
                            <span>{isSyncing ? 'Sincronizando...' : (window.firebaseDB ? 'Nuvem Conectada' : 'Modo Local')}</span>
                        </div>
                        <button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl bg-red-600/20 hover:bg-red-600 text-red-200 hover:text-white transition-colors text-sm font-medium">
                            <Icon name="log-out" className="w-4 h-4" />
                            <span>Sair</span>
                        </button>
                    </div>
                </div>
            );

            // --- COMPONENTE: CLIENTES ---
            const ClientesView = () => {
                const [newClient, setNewClient] = useState({ name: '', company: '', contact: '', plan: 'Plano Básico', isFreeTrial: false, trialDuration: '' });
                const [searchTerm, setSearchTerm] = useState('');
                const [filterPlan, setFilterPlan] = useState('');
                const [filterTrial, setFilterTrial] = useState('');
                const [activeDropdown, setActiveDropdown] = useState(null);

                const handleAddClient = (e) => {
                    e.preventDefault();
                    if (!newClient.name || !newClient.company) return;
                    const newClientId = generateId('c');
                    const clientData = { ...newClient, id: newClientId };
                    
                    setClients([...clients, clientData]);
                    saveToCloud("clients", newClientId, clientData);
                    
                    const newListId = generateId('l');
                    const listData = { id: newListId, title: newClient.name };
                    setKanbanLists([...kanbanLists, listData]);
                    saveToCloud("kanbanLists", newListId, listData);

                    setNewClient({ name: '', company: '', contact: '', plan: 'Plano Básico', isFreeTrial: false, trialDuration: '' });
                };

                const handleDeleteClient = (e, id) => {
                    e.stopPropagation();
                    setClients(clients.filter(c => c.id !== id));
                    removeFromCloud("clients", id);
                    setActiveDropdown(null);
                };

                const handleClientClick = (client) => {
                    setActiveTab('kanban');
                    setTimeout(() => {
                        const listElements = document.querySelectorAll('[data-list-title]');
                        let targetList = null;
                        listElements.forEach(el => {
                            if (el.getAttribute('data-list-title') === client.name) targetList = el;
                        });
                        if (targetList) {
                            targetList.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                            targetList.classList.add('ring-4', 'ring-blue-400', 'transition-all', 'duration-500');
                            setTimeout(() => targetList.classList.remove('ring-4', 'ring-blue-400'), 2000);
                        }
                    }, 100);
                };

                const filteredClients = clients.filter(c => {
                    const matchSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase()) || c.company.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchPlan = filterPlan ? c.plan === filterPlan : true;
                    const matchTrial = filterTrial ? (filterTrial === 'sim' ? c.isFreeTrial : !c.isFreeTrial) : true;
                    return matchSearch && matchPlan && matchTrial;
                });

                return (
                    <div className="max-w-4xl mx-auto space-y-8 animate-in fade-in duration-300 w-full pb-10">
                        <div className={`${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-gray-100 text-gray-800'} p-6 rounded-2xl shadow-sm border`}>
                            <h2 className={`text-2xl font-bold mb-6 flex items-center ${isDarkMode ? 'text-white' : 'text-[#08194c]'}`}>
                                <Icon name="users" className="w-6 h-6 mr-3 text-blue-500" /> Novo Cliente
                            </h2>
                            <form onSubmit={handleAddClient} className="flex flex-col gap-4">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <input type="text" placeholder="Nome do Responsável" required className={`w-full p-3 border rounded-xl outline-none text-sm md:text-base ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-gray-200'}`} value={newClient.name} onChange={(e) => setNewClient({ ...newClient, name: e.target.value })} />
                                    <input type="text" placeholder="Empresa" required className={`w-full p-3 border rounded-xl outline-none text-sm md:text-base ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-gray-200'}`} value={newClient.company} onChange={(e) => setNewClient({ ...newClient, company: e.target.value })} />
                                    <input type="text" placeholder="WhatsApp ou Email" required className={`w-full p-3 border rounded-xl outline-none text-sm md:text-base ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-gray-200'}`} value={newClient.contact} onChange={(e) => setNewClient({ ...newClient, contact: e.target.value })} />
                                </div>
                                
                                <div className={`flex flex-col md:flex-row items-start md:items-center gap-4 p-4 rounded-xl border ${isDarkMode ? 'bg-slate-900/40 border-slate-700' : 'bg-gray-50/50 border-gray-100'}`}>
                                    <div className="w-full md:w-auto">
                                        <span className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Plano Atual</span>
                                        <select className={`w-full p-2.5 border rounded-lg outline-none text-sm ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white border-gray-200'}`} value={newClient.plan} onChange={(e) => setNewClient({...newClient, plan: e.target.value})}>
                                            <option value="Plano Básico">Plano Básico</option>
                                            <option value="Plano Pro">Plano Pro</option>
                                            <option value="Plano Enterprise">Plano Enterprise</option>
                                            <option value="Personalizado">Personalizado</option>
                                        </select>
                                    </div>
                                    <div className="w-full md:w-auto flex flex-col md:flex-row md:items-center gap-4">
                                        <label className={`flex items-center space-x-2 text-sm cursor-pointer mt-1 md:mt-5 ${isDarkMode ? 'text-slate-200' : 'text-gray-700'}`}>
                                            <input type="checkbox" className="w-4 h-4 rounded border-gray-300 text-blue-600" checked={newClient.isFreeTrial} onChange={(e) => setNewClient({...newClient, isFreeTrial: e.target.checked})} />
                                            <span className="font-medium">Em Free Trial?</span>
                                        </label>
                                        {newClient.isFreeTrial && (
                                            <div className="w-full md:w-auto">
                                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Duração</span>
                                                <input type="text" placeholder="Ex: 14 dias..." className={`w-full p-2 border rounded-lg outline-none text-sm ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white border-gray-200'}`} value={newClient.trialDuration} onChange={(e) => setNewClient({...newClient, trialDuration: e.target.value})} />
                                            </div>
                                        )}
                                    </div>
                                    <div className="ml-auto mt-2 md:mt-0 w-full md:w-auto flex">
                                        <button type="submit" className={`w-full md:w-auto px-6 py-2.5 rounded-xl transition-colors shadow-md flex items-center justify-center font-semibold text-sm ${isDarkMode ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-[#08194c] hover:bg-blue-900 text-white'}`}>
                                            <Icon name="plus" className="w-5 h-5 mr-1" /> Adicionar Cliente
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div className={`${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-gray-100 text-gray-800'} rounded-2xl shadow-sm border overflow-hidden`}>
                            <div className={`p-6 border-b flex flex-col gap-4 ${isDarkMode ? 'border-slate-700 bg-slate-800/80' : 'border-gray-100 bg-gray-50/50'}`}>
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <h3 className="text-xl font-bold">Clientes Cadastrados</h3>
                                    <div className="relative">
                                        <Icon name="search" className="w-5 h-5 absolute left-3 top-2.5 text-gray-400" />
                                        <input 
                                            type="text" 
                                            placeholder="Pesquisar cliente..." 
                                            className={`pl-10 pr-4 py-2 border rounded-xl outline-none w-full md:w-64 text-sm ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-gray-200'}`}
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                        />
                                    </div>
                                </div>
                                
                                <div className="flex flex-col md:flex-row gap-3">
                                    <select 
                                        className={`p-2 border rounded-lg text-sm outline-none w-full md:w-auto ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white border-gray-200'}`}
                                        value={filterPlan}
                                        onChange={(e) => setFilterPlan(e.target.value)}
                                    >
                                        <option value="">Todos os Planos</option>
                                        <option value="Plano Básico">Plano Básico</option>
                                        <option value="Plano Pro">Plano Pro</option>
                                        <option value="Plano Enterprise">Plano Enterprise</option>
                                        <option value="Personalizado">Personalizado</option>
                                    </select>
                                    <select 
                                        className={`p-2 border rounded-lg text-sm outline-none w-full md:w-auto ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white border-gray-200'}`}
                                        value={filterTrial}
                                        onChange={(e) => setFilterTrial(e.target.value)}
                                    >
                                        <option value="">Todos (Trial)</option>
                                        <option value="sim">Em Free Trial</option>
                                        <option value="nao">Sem Free Trial</option>
                                    </select>
                                </div>
                            </div>
                            <div className={`divide-y ${isDarkMode ? 'divide-slate-700' : 'divide-gray-100'}`}>
                                {filteredClients.length === 0 ? (
                                    <p className="p-8 text-center text-gray-400">Nenhum cliente encontrado.</p>
                                ) : (
                                    filteredClients.map(client => {
                                        const wppLink = formatWhatsApp(client.contact);
                                        return (
                                            <div key={client.id} onClick={() => handleClientClick(client)} className={`p-6 flex flex-col md:flex-row md:items-center justify-between transition-colors cursor-pointer relative group ${isDarkMode ? 'hover:bg-slate-700/50' : 'hover:bg-gray-50'}`}>
                                                <div className="flex-1 pr-4">
                                                    <h4 className={`font-bold text-lg flex items-center ${isDarkMode ? 'text-white' : 'text-[#08194c]'}`}>
                                                        <Icon name="building-2" className="w-4 h-4 mr-2 text-gray-400" /> {client.company}
                                                    </h4>
                                                    <p className={`mt-1 flex items-center ${isDarkMode ? 'text-slate-300' : 'text-gray-600'}`}>
                                                        <Icon name="users" className="w-4 h-4 mr-2 text-gray-400" /> {client.name}
                                                    </p>
                                                    <div className="flex flex-wrap items-center gap-2 mt-3">
                                                        <span className={`text-xs font-semibold px-2.5 py-1 rounded border ${isDarkMode ? 'bg-blue-900/40 text-blue-200 border-blue-800' : 'bg-blue-50 text-[#08194c] border-blue-100'}`}>
                                                            {client.plan || 'Plano Básico'}
                                                        </span>
                                                        {client.isFreeTrial && (
                                                            <span className={`text-xs font-semibold px-2.5 py-1 rounded border ${isDarkMode ? 'bg-orange-950/40 text-orange-300 border-orange-900' : 'bg-orange-50 text-orange-600 border-orange-200'}`}>
                                                                Free Trial: {client.trialDuration || 'Não especificado'}
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                                <div className="mt-4 md:mt-0 flex items-center space-x-3">
                                                    {wppLink ? (
                                                        <a href={wppLink} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()} className={`text-sm px-4 py-2 rounded-full font-medium inline-flex items-center w-max transition-colors ${isDarkMode ? 'bg-green-950/60 text-green-300 hover:bg-green-900' : 'bg-green-50 text-green-700 hover:bg-green-100'}`}>
                                                            <Icon name="message-circle" className="w-4 h-4 mr-2" /> {client.contact}
                                                        </a>
                                                    ) : (
                                                        <span className={`text-sm px-4 py-2 rounded-full font-medium inline-flex items-center w-max ${isDarkMode ? 'bg-blue-950/60 text-blue-300' : 'bg-blue-50 text-blue-800'}`}>
                                                            <Icon name="phone" className="w-4 h-4 mr-2" /> {client.contact}
                                                        </span>
                                                    )}
                                                    
                                                    <div className="relative">
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); setActiveDropdown(activeDropdown === client.id ? null : client.id); }} 
                                                            className={`p-2 rounded-full transition-colors ${isDarkMode ? 'text-slate-400 hover:text-white hover:bg-slate-700' : 'text-gray-400 hover:text-gray-700 hover:bg-gray-200'}`}
                                                        >
                                                            <Icon name="more-vertical" className="w-5 h-5" />
                                                        </button>
                                                        {activeDropdown === client.id && (
                                                            <>
                                                                <div className="fixed inset-0 z-10" onClick={(e) => { e.stopPropagation(); setActiveDropdown(null); }}></div>
                                                                <div className={`absolute right-0 mt-2 w-36 rounded-xl shadow-lg border z-20 overflow-hidden ${isDarkMode ? 'bg-slate-700 border-slate-600' : 'bg-white border-gray-100'}`}>
                                                                    <button 
                                                                        onClick={(e) => handleDeleteClient(e, client.id)}

            // --- MODAL TIMELINE / GANTT ---
            const TimelineModal = () => {
                if (!timelineModalProject) return null;
                const [newItem, setNewItem] = useState({ title: '', startDate: '', endDate: '' });

                const projectItems = timelineItems.filter(item => item.projectId === timelineModalProject.id);

                const handleAddItem = (e) => {
                    e.preventDefault();
                    if (!newItem.title || !newItem.startDate || !newItem.endDate) return;
                    const timeData = {
                        id: generateId('tl'),
                        projectId: timelineModalProject.id,
                        ...newItem,
                        completed: false
                    };
                    setTimelineItems([...timelineItems, timeData]);
                    saveToCloud("timeline", timeData.id, timeData);
                    setNewItem({ title: '', startDate: '', endDate: '' });
                };

                const toggleComplete = (id) => {
                    const updated = timelineItems.map(item => {
                        if (item.id === id) {
                            const changed = { ...item, completed: !item.completed };
                            saveToCloud("timeline", id, changed);
                            return changed;
                        }
                        return item;
                    });
                    setTimelineItems(updated);
                };

                const deleteTimelineItem = (id) => {
                    setTimelineItems(timelineItems.filter(item => item.id !== id));
                    removeFromCloud("timeline", id);
                };

                const getDaysStatus = (endDateStr) => {
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    const end = new Date(endDateStr);
                    end.setHours(0,0,0,0);
                    const diffTime = end - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays > 0) return { text: `${diffDays} dias restantes`, color: 'text-blue-600 bg-blue-50' };
                    if (diffDays === 0) return { text: 'Vence hoje', color: 'text-orange-600 bg-orange-50' };
                    return { text: `Atrasado ${Math.abs(diffDays)} dias`, color: 'text-red-600 bg-red-50' };
                };

                const getMonthsList = () => [
                    { name: 'Janeiro', days: 31 }, { name: 'Fevereiro', days: 28 }, { name: 'Março', days: 31 },
                    { name: 'Abril', days: 30 }, { name: 'Maio', days: 31 }, { name: 'Junho', days: 30 },
                    { name: 'Julho', days: 31 }, { name: 'Agosto', days: 31 }, { name: 'Setembro', days: 30 },
                    { name: 'Outubro', days: 31 }, { name: 'Novembro', days: 30 }, { name: 'Dezembro', days: 31 },

                const todayDate = new Date();
                const currentMonthIndex = todayDate.getMonth();
                const currentDayNumber = todayDate.getDate();

                return (
                    <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex flex-col animate-in fade-in duration-200">

                                </div>

                                <h3 className="font-bold mb-4 flex items-center">
                                    <Icon name="list-plus" className="w-5 h-5 mr-2 text-blue-500" /> Etapas do Projeto

                                <form onSubmit={handleAddItem} className={`space-y-3 mb-6 p-4 rounded-xl border ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-gray-50 border-gray-200'}`}>
                                    <input type="text" placeholder="Nome da etapa..." required className={`w-full p-2.5 border rounded-lg text-sm outline-none ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-gray-200'}`} value={newItem.title} onChange={(e) => setNewItem({...newItem, title: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-2">

                                            <input type="date" required className={`w-full p-2 border rounded-lg text-xs outline-none ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white border-gray-200'}`} value={newItem.startDate} onChange={(e) => setNewItem({...newItem, startDate: e.target.value})} />

                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center">
                                        <Icon name="plus" className="w-4 h-4 mr-1" /> Adicionar Etapa
                                    </button>
                                </form>

                                <div className="space-y-3 flex-1 overflow-y-auto">
                                    {projectItems.length === 0 ? (
                                        <p className="text-gray-400 text-sm text-center py-6">Nenhuma etapa cadastrada.</p>
                                    ) : (
                                        projectItems.map(item => {
                                            const status = getDaysStatus(item.endDate);
                                            return (
                                                <div key={item.id} className={`p-4 rounded-xl border transition-all ${item.completed ? (isDarkMode ? 'bg-emerald-950/30 border-emerald-900' : 'bg-emerald-50/50 border-emerald-200') : (isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200 shadow-sm')}`}>
                                                    <div className="flex items-start justify-between">

                                                                <p className="text-xs text-slate-400 mt-1 flex items-center">
                                                                    <Icon name="calendar" className="w-3.5 h-3.5 mr-1" /> {item.startDate} até {item.endDate}

                                                                    {item.completed ? 'Concluído' : status.text}
                                                                </span>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => deleteTimelineItem(item.id)} className="text-slate-500 hover:text-red-400 transition-colors">
                                                            <Icon name="trash-2" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>

                            <div className={`flex-1 p-6 overflow-x-auto flex flex-col ${isDarkMode ? 'bg-slate-900 text-white' : 'bg-white text-gray-800'}`}>
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-bold flex items-center">
                                        <Icon name="calendar" className="w-5 h-5 mr-2 text-blue-500" /> Gráfico de Gantt (Timeline)

                                    </div>
                                </div>

                                <div className={`flex-1 rounded-2xl border p-4 overflow-x-auto relative min-w-[700px] ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-gray-50 border-gray-200'}`}>
                                    <div className={`grid grid-cols-12 gap-2 border-b pb-3 mb-4 sticky top-0 z-10 ${isDarkMode ? 'border-slate-800 bg-slate-950' : 'border-gray-200 bg-gray-50'}`}>
                                        {months.map((m, idx) => (
                                            <div key={m.name} className={`text-center font-bold text-xs uppercase tracking-wider py-1 rounded ${idx === currentMonthIndex ? 'bg-blue-600 text-white shadow' : (isDarkMode ? 'text-slate-400 bg-slate-800' : 'text-gray-600 bg-gray-200/60')}`}>
                                                {m.name}
                                            </div>
                                        ))}
                                    </div>

                                        <span className="absolute -top-3 -translate-x-1/2 bg-orange-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow">Hoje ({currentDayNumber})</span>
                                    </div>

                                    <div className="space-y-4 pt-2 relative">
                                        {projectItems.length === 0 ? (
                                            <div className="text-center py-20 text-slate-500 text-sm">Adicione etapas à esquerda.</div>
                                        ) : (
                                            projectItems.map((item) => {
                                                const startD = new Date(item.startDate);
                                                const endD = new Date(item.endDate);
                                                const startDayOfYear = (startD.getMonth() * 30) + startD.getDate();
                                                const endDayOfYear = (endD.getMonth() * 30) + endD.getDate();
                                                
                                                const leftPercent = Math.max(0, Math.min(95, (startDayOfYear / 365) * 100));
                                                const widthPercent = Math.max(5, Math.min(100 - leftPercent, ((endDayOfYear - startDayOfYear) / 365) * 100));

                                                return (
                                                    <div key={item.id} className={`relative h-14 rounded-xl border flex items-center px-4 shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>

                                                                <span className="truncate">{item.startDate} até {item.endDate}</span>
                                                            </div>
                                                        </div>
                                                    </div>

            // --- COMPONENTE: KANBAN ---
            const KanbanView = () => {
                const [newListTitle, setNewListTitle] = useState('');

                const [activeDropdownList, setActiveDropdownList] = useState(null);

                const handleAddList = (e) => {
                    e.preventDefault();
                    if (!newListTitle) return;
                    const listData = { id: generateId('l'), title: newListTitle };

                    saveToCloud("kanbanLists", listData.id, listData);
                    setNewListTitle('');
                };

                const handleDeleteList = (listId) => {
                    setKanbanLists(kanbanLists.filter(l => l.id !== listId));
                    removeFromCloud("kanbanLists", listId);
                    setTasks(tasks.filter(t => t.listId !== listId));
                    setActiveDropdownList(null);
                };

                const handleAddTask = (e, listId) => {
                    e.preventDefault();
                    if (!newTask.title) return;

                        id: generateId('t'),
                        title: newTask.title,
                        listId: listId,
                        projectId: newTask.projectId || projects[0]?.id || '',
                        description: newTask.description || '',
                        attachments: []
                    };
                    setTasks([...tasks, taskData]);
                    saveToCloud("tasks", taskData.id, taskData);
                    setNewTask({ title: '', listId: '', projectId: '', description: '' });
                };

                const moveTask = (taskId, targetListId) => {
                    const updated = tasks.map(t => {
                        if (t.id === taskId) {
                            const changed = { ...t, listId: targetListId };
                            saveToCloud("tasks", taskId, changed);
                            return changed;
                        }
                        return t;
                    });
                    setTasks(updated);
                };

                    setTasks(tasks.filter(t => t.id !== taskId));
                    removeFromCloud("tasks", taskId);
                };

                return (
                    <div className="h-full flex flex-col space-y-6 animate-in fade-in duration-300 w-full">

                                            </div>
                                            <div className="relative">
                                                <button onClick={() => setActiveDropdownList(activeDropdownList === list.id ? null : list.id)} className={`p-1 rounded-full transition-colors ${isDarkMode ? 'text-slate-400 hover:text-white hover:bg-slate-700' : 'text-gray-400 hover:text-gray-700 hover:bg-gray-100'}`}>
                                                    <Icon name="more-vertical" className="w-4 h-4" />
                                                </button>
                                                {activeDropdownList === list.id && (
                                                    <>
                                                        <div className="fixed inset-0 z-10" onClick={() => setActiveDropdownList(null)}></div>
                                                        <div className={`absolute right-0 mt-2 w-36 rounded-xl shadow-lg border z-20 overflow-hidden ${isDarkMode ? 'bg-slate-700 border-slate-600' : 'bg-white border-gray-100'}`}>
                                                            <button onClick={() => handleDeleteList(list.id)} className={`w-full text-left px-4 py-3 text-sm flex items-center transition-colors font-medium ${isDarkMode ? 'text-red-300 hover:bg-slate-600' : 'text-red-600 hover:bg-red-50'}`}>
                                                                <Icon name="trash-2" className="w-4 h-4 mr-2" /> Deletar Lista
                                                            </button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        </div>

                                        <div className="p-3 space-y-3 overflow-y-auto flex-1">
                                            {listTasks.map(task => (
                                                <div key={task.id} onClick={() => setTaskDetailsModal(task)} className={`p-4 rounded-xl shadow-sm border transition-all cursor-pointer relative group ${isDarkMode ? 'bg-slate-800 border-slate-700 hover:border-blue-500 text-white' : 'bg-white border-gray-200 hover:border-blue-300'}`}>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className={`text-[10px] font-semibold px-2 py-0.5 rounded ${isDarkMode ? 'bg-indigo-950 text-indigo-300' : 'bg-indigo-50 text-indigo-700'}`}>{getProjectName(task.projectId)}</span>
                                                        <select onClick={(e) => e.stopPropagation()} onChange={(e) => moveTask(task.id, e.target.value)} value={task.listId} className={`text-[10px] border rounded p-1 outline-none font-medium ${isDarkMode ? 'bg-slate-700 border-slate-600 text-slate-300' : 'bg-gray-100 border-gray-200 text-gray-600'}`}>
                                                            {kanbanLists.map(l => <option key={l.id} value={l.id}>{l.title}</option>)}
                                                        </select>
                                                    </div>
                                                    <h4 className="font-semibold text-sm mb-2">{task.title}</h4>
                                                    {task.description && <p className={`text-xs line-clamp-2 mb-2 ${isDarkMode ? 'text-slate-400' : 'text-gray-500'}`}>{task.description}</p>}
                                                    <div className={`flex items-center justify-between pt-2 border-t text-xs ${isDarkMode ? 'border-slate-700 text-slate-500' : 'border-gray-100 text-gray-400'}`}>
                                                        <div className="flex items-center space-x-2">
                                                            {task.attachments && task.attachments.length > 0 && <span className="flex items-center text-blue-400"><Icon name="paperclip" className="w-3 h-3 mr-1" /> {task.attachments.length}</span>}
                                                        </div>
                                                        <button onClick={(e) => { e.stopPropagation(); deleteTask(task.id); }} className="hover:text-red-400 transition-colors">
                                                            <Icon name="trash-2" className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className={`p-3 border-t rounded-b-2xl ${isDarkMode ? 'border-slate-800 bg-slate-800/90' : 'border-gray-200 bg-white'}`}>
                                            <form onSubmit={(e) => handleAddTask(e, list.id)} className="space-y-2">
                                                <input type="text" placeholder="Novo cartão..." className={`w-full p-2 border rounded-lg text-xs outline-none ${isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-gray-200'}`} value={newTask.listId === list.id ? newTask.title : ''} onChange={(e) => setNewTask({ title: e.target.value, listId: list.id, projectId: projects[0]?.id || '' })} />
                                                <button type="submit" className={`w-full py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center justify-center ${isDarkMode ? 'bg-slate-700 hover:bg-blue-600 text-white' : 'bg-gray-100 hover:bg-[#08194c] hover:text-white text-gray-700'}`}>
                                                    <Icon name="plus" className="w-3.5 h-3.5 mr-1" /> Adicionar Cartão
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // --- MODAL KANBAN CARTÃO ---
            const TaskDetailsModal = () => {
                if (!taskDetailsModal) return null;
                const [currentTask, setCurrentTask] = useState(taskDetailsModal);
                const [newLink, setNewLink] = useState('');

                const handleUpdateTask = () => {
                    setTasks(tasks.map(t => {
                        if (t.id === currentTask.id) {
                            saveToCloud("tasks", currentTask.id, currentTask);
                            return currentTask;
                        }
                        return t;
                    }));
                    setTaskDetailsModal(null);
                };

                const handleAddAttachment = (e) => {
                    e.preventDefault();
                    if (!newLink) return;
                    let formattedLink = newLink.trim();
                    if (!formattedLink.startsWith('http://') && !formattedLink.startsWith('https://')) {
                        formattedLink = 'https://' + formattedLink;
                    }
                    const updatedAttachments = [...(currentTask.attachments || []), formattedLink];
                    setCurrentTask({ ...currentTask, attachments: updatedAttachments });
                    setNewLink('');
                };

                const removeAttachment = (index) => {
                    const updatedAttachments = currentTask.attachments.filter((_, i) => i !== index);
                    setCurrentTask({ ...currentTask, attachments: updatedAttachments });
                };

                const handleDeleteCard = () => {
                    setTasks(tasks.filter(t => t.id !== currentTask.id));
                    removeFromCloud("tasks", currentTask.id);
                    setTaskDetailsModal(null);
                };

                return (
                    <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in duration-200">
                        <div className={`rounded-2xl shadow-xl border w-full max-w-xl overflow-hidden flex flex-col max-h-[90vh] ${isDarkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-gray-100 text-gray-800'}`}>
                            <div className={`p-6 border-b flex items-center justify-between ${isDarkMode ? 'border-slate-800 bg-slate-800/80' : 'border-gray-100 bg-gray-50/50'}`}>
                                <h3 className={`text-xl font-bold flex items-center ${isDarkMode ? 'text-white' : 'text-[#08194c]'}`}>
                                    <Icon name="kanban" className="w-5 h-5 mr-2 text-blue-500" /> Detalhes do Cartão
                                </h3>
                                <button onClick={() => setTaskDetailsModal(null)} className="text-gray-400 hover:text-white">
                                    <Icon name="x" className="w-6 h-6" />
                                </button>
                            </div>
                            <div className="p-6 space-y-6 overflow-y-auto flex-1">
                                <div>
                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Título</label>
                                    <input type="text" className={`w-full p-3 border rounded-xl font-semibold outline-none ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-gray-200'}`} value={currentTask.title} onChange={(e) => setCurrentTask({ ...currentTask, title: e.target.value })} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1 flex items-center">
                                        <Icon name="align-left" className="w-4 h-4 mr-1 text-blue-500" /> Descrição
                                    </label>
                                    <textarea rows="4" placeholder="Adicione uma descrição detalhada..." className={`w-full p-3 border rounded-xl text-sm outline-none ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-gray-200'}`} value={currentTask.description} onChange={(e) => setCurrentTask({ ...currentTask, description: e.target.value })}></textarea>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2 flex items-center">
                                        <Icon name="paperclip" className="w-4 h-4 mr-1 text-blue-500" /> Anexar Links
                                    </label>
                                    <form onSubmit={handleAddAttachment} className="flex gap-2 mb-3">
                                        <input type="text" placeholder="Ex: wa.me/5511999999999..." className={`flex-1 p-2.5 border rounded-xl text-sm outline-none ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-gray-200'}`} value={newLink} onChange={(e) => setNewLink(e.target.value)} />
                                        <button type="submit" className={`px-4 py-2.5 rounded-xl text-sm font-semibold transition-colors ${isDarkMode ? 'bg-blue-950 text-blue-300 hover:bg-blue-900' : 'bg-blue-50 hover:bg-blue-100 text-[#08194c]'}`}>Anexar</button>
                                    </form>
                                    <div className="space-y-2">
                                        {currentTask.attachments && currentTask.attachments.map((link, idx) => (
                                            <div key={idx} className={`flex items-center justify-between p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-gray-50 border-gray-200'}`}>
                                                <a href={link} target="_blank" rel="noreferrer" className="text-sm text-blue-400 hover:underline flex items-center truncate">
                                                    <Icon name="link" className="w-4 h-4 mr-2 flex-shrink-0" /> <span className="truncate">{link}</span>
                                                </a>
                                                <button onClick={() => removeAttachment(idx)} className="text-gray-400 hover:text-red-400 p-1"><Icon name="trash-2" className="w-4 h-4" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className={`p-6 border-t flex items-center justify-between ${isDarkMode ? 'border-slate-800 bg-slate-800/80' : 'border-gray-100 bg-gray-50/50'}`}>
                                <button onClick={handleDeleteCard} className={`px-4 py-2.5 rounded-xl text-sm font-semibold transition-colors flex items-center ${isDarkMode ? 'bg-red-950/60 text-red-300 hover:bg-red-900' : 'bg-red-50 hover:bg-red-100 text-red-600'}`}>
                                    <Icon name="trash-2" className="w-4 h-4 mr-1.5" /> Excluir
                                </button>
                                <div className="flex space-x-3">
                                    <button onClick={() => setTaskDetailsModal(null)} className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors ${isDarkMode ? 'bg-slate-800 hover:bg-slate-700 text-slate-200' : 'bg-gray-200 hover:bg-gray-300 text-gray-700'}`}>Cancelar</button>
                                    <button onClick={handleUpdateTask} className="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition-colors shadow-md">Salvar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className={`flex h-screen font-sans overflow-hidden ${isDarkMode ? 'bg-slate-950 text-white' : 'bg-gray-100 text-gray-800'}`}>
                    {/* Modal para configurar credenciais de nuvem de forma privada */}
                    {showConfigModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white text-gray-800 rounded-2xl shadow-2xl border border-gray-100 w-full max-w-lg p-6">
                                <h3 className="text-lg font-bold text-[#08194c] mb-2">Configurar Conexão com Firebase</h3>
                                <p className="text-xs text-gray-500 mb-4">Cole abaixo o objeto javascript completo do seu firebaseConfig para habilitar a sincronização automática em nuvem de forma segura.</p>
                                <form onSubmit={handleSaveFirebaseConfig} className="space-y-4">
                                    <textarea 
                                        rows="6" 
                                        placeholder={`{\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  storageBucket: "...",\n  messagingSenderId: "...",\n  appId: "..."\n}`}
                                        className="w-full p-3 border border-gray-200 rounded-xl font-mono text-xs outline-none focus:ring-2 focus:ring-[#08194c]"
                                        value={firebaseJsonInput}
                                        onChange={(e) => setFirebaseJsonInput(e.target.value)}
                                    ></textarea>
                                    <div className="flex justify-end space-x-3">
                                        <button type="button" onClick={() => setShowConfigModal(false)} className="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl text-sm font-semibold">Cancelar</button>
                                        <button type="submit" className="px-5 py-2 bg-[#08194c] hover:bg-blue-900 text-white rounded-xl text-sm font-semibold">Salvar e Conectar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {!isAuthenticated ? (
                        <div className="flex-1 flex items-center justify-center bg-gradient-to-br from-[#08194c] to-blue-950 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl border border-gray-100 w-full max-w-md p-8">
                                <div className="flex flex-col items-center mb-8">
                                    <div className="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mb-4 text-[#08194c]">
                                        <Icon name="layout-dashboard" className="w-8 h-8" />
                                    </div>
                                    <h1 className="text-2xl font-bold text-[#08194c]">Oliveira Vitis</h1>
                                    <p className="text-sm text-gray-500 mt-1">Faça login para acessar o painel</p>
                                </div>
                                {loginError && (
                                    <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl font-medium">{loginError}</div>
                                )}
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-1">Usuário</label>
                                        <input type="text" placeholder="Digite seu e-mail" required className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#08194c]" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-1">Senha</label>
                                        <input type="password" placeholder="••••••••" required className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-[#08194c]" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} />
                                    </div>
                                    <button type="submit" className="w-full bg-[#08194c] hover:bg-blue-900 text-white py-3 rounded-xl font-semibold shadow-lg mt-2 text-sm transition-colors">Entrar no Sistema</button>
                                </form>
                                <div className="mt-6 flex items-center justify-between text-xs text-gray-400">
                                    <span>Oliveira Vitis</span>
                                    <button onClick={() => setShowConfigModal(true)} className="text-blue-600 hover:underline font-medium">Configurar Nuvem</button>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <>
                            <Sidebar />
                            <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                                <div className={`md:hidden p-4 flex items-center justify-between flex-shrink-0 ${isDarkMode ? 'bg-slate-900 border-b border-slate-800 text-white' : 'bg-[#08194c] text-white'}`}>
                                    <button onClick={() => setIsMobileMenuOpen(true)} className="p-1">
                                        <Icon name="menu" className="w-6 h-6" />
                                    </button>
                                    <span className="font-bold">Oliveira Vitis</span>
                                    <button onClick={toggleDarkMode} className="p-1">
                                        <Icon name={isDarkMode ? "sun" : "moon"} className="w-5 h-5 text-yellow-300" />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 md:p-8">
                                    {activeTab === 'clientes' && <ClientesView />}
                                    {activeTab === 'projetos' && <ProjetosView />}
                                    {activeTab === 'kanban' && <KanbanView />}
                                </div>
                            </div>
                            <TimelineModal />
                            <TaskDetailsModal />
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
